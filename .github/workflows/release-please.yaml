---
name: Release Please
"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      boards_released: ${{ steps.route.outputs.boards }}
      lcd_tag: ${{ steps.release.outputs['lcd_control_unit--tag_name'] }}
      protection_tag: >-
        ${{ steps.release.outputs['power_monitor_protection--tag_name'] }}
    steps:
      - name: Prepare releases
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Route released components
        id: route
        uses: actions/github-script@v8
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released || '[]' }}
        with:
          script: |
            const paths = JSON.parse(process.env.PATHS_RELEASED);
            const boards = paths.filter(path =>
              ['lcd_control_unit', 'power_monitor_protection'].includes(path));
            core.setOutput('boards', JSON.stringify(boards));

  kicad:
    needs: release
    if: >-
      needs.release.outputs.boards_released != '[]' &&
      needs.release.outputs.boards_released != ''
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.release.outputs.boards_released) }}
    uses: ./.github/workflows/kicad.yaml
    with:
      boards: ${{ format('["{0}"]', matrix.board) }}
      ref: >-
        ${{ matrix.board == 'lcd_control_unit' &&
        needs.release.outputs.lcd_tag ||
        needs.release.outputs.protection_tag }}

  attach-kicad-outputs:
    needs: [release, kicad]
    if: >-
      !cancelled() && needs.release.result == 'success' &&
      needs.release.outputs.boards_released != '[]' &&
      needs.release.outputs.boards_released != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.release.outputs.boards_released) }}
    steps:
      - name: Download schematic outputs
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.board }}-schematic
          path: release-assets/schematic
      - name: Download ERC report
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.board }}-erc-report
          path: release-assets/erc-report
      - name: Attach KiCad outputs to the board release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: >-
            ${{ matrix.board == 'lcd_control_unit' &&
            needs.release.outputs.lcd_tag ||
            needs.release.outputs.protection_tag }}
          fail_on_unmatched_files: true
          files: |
            release-assets/schematic/schematic.pdf
            release-assets/schematic/schematics/*.svg
            release-assets/schematic/bom.csv
            release-assets/schematic/netlist.net
            release-assets/erc-report/erc.rpt
