on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          release-type: simple

  kicad-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: lcd-control-unit
            schematic: lcd_control_unit/lcd_control_unit.kicad_sch
            pcb: lcd_control_unit/lcd_control_unit.kicad_pcb

          - name: power-monitor-protection
            schematic: power_monitor_protection/power_monitor_protection.kicad_sch
            pcb: power_monitor_protection/power_monitor_protection.kicad_pcb

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Generate KiCad outputs (${{ matrix.name }})
        uses: actions-for-kicad/kicad-actions@v2-k10.0.5
        with:
          schematic_file_name: ${{ matrix.schematic }}
          pcb_file_name: ${{ matrix.pcb }}

          run_erc: true
          # run_drc: true # No PCBs

          schematic_output_pdf: true
          schematic_output_svg: true
          schematic_output_bom: true
          # pcb_output_gerbers_and_drill: true

      # -----------------------------
      # Rename outputs to avoid collisions
      # -----------------------------
      - name: Rename outputs (clean naming)
        run: |
          mkdir -p release-assets

          # schematic
          mv schematic.pdf release-assets/${{ matrix.name }}-schematic.pdf || true
          mv schematic.svg release-assets/${{ matrix.name }}-schematic.svg || true

          # BOM
          mv bom.csv release-assets/${{ matrix.name }}-bom.csv || true

          # ERC/DRC reports
          mv erc.rpt release-assets/${{ matrix.name }}-erc.rpt || true
          # mv drc.rpt release-assets/${{ matrix.name }}-drc.rpt || true

          # Gerbers (zip if present)
          if [ -d gerbers ]; then
            zip -r release-assets/${{ matrix.name }}-gerbers.zip gerbers
          fi

      # -----------------------------
      # Upload to GitHub Release
      # -----------------------------
      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: false
