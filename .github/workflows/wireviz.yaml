---
name: WireViz
"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or release tag to render
        type: string
        default: ""

permissions:
  contents: read

jobs:
  harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz fonts-dejavu-core zip
      - name: Render and package harnesses
        run: |
          mkdir -p wiring/output
          for source in wiring/*.yaml wiring/*/*.yaml; do
            name=${source#wiring/}
            name=${name%.yaml}
            output="wiring/output/$(dirname "$name")"
            mkdir -p "$output"
            uvx --from wireviz==0.4.1 wireviz -f hpst \
              -o "$output" "$source"
            for suffix in svg png html bom.tsv; do
              test -s "wiring/output/$name.$suffix"
            done
          done
          zip wiring/output/wiring.zip wiring/*.yaml wiring/*.md \
            wiring/*/*.yaml \
            wiring/output/*.svg wiring/output/*/*.svg \
            wiring/output/*.png wiring/output/*/*.png \
            wiring/output/*.html wiring/output/*/*.html \
            wiring/output/*.bom.tsv wiring/output/*/*.bom.tsv
      - name: Upload wiring outputs
        uses: actions/upload-artifact@v7
        with:
          name: wiring-diagrams
          retention-days: 7
          if-no-files-found: error
          path: |
            wiring/output/**/*.svg
            wiring/output/**/*.png
            wiring/output/**/*.html
            wiring/output/**/*.bom.tsv
            wiring/output/wiring.zip
